name: Balance Gates (Fast)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Balance Gates
        env:
          BALANCE_GAMES_PER_MATCHUP: '6'
          BALANCE_MAX_STEPS: '1000'
        run: pnpm run balance:gate
